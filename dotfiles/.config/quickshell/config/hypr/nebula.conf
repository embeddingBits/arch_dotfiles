# Nebula shell — additions for classic hyprland.conf (non-Lua setup)
# Source this file or paste its contents into your hyprland.conf.

# ── Environment ───────────────────────────────────────────────────────────────
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QML_IMPORT_PATH,$HOME/.local/lib/qt6/qml
env = NEBULA_VENV,$HOME/.local/state/quickshell/.venv
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = SDL_VIDEODRIVER,wayland

# ── Material You colors (generated by matugen on wallpaper change) ────────────
source = ~/.config/hypr/colors.conf

# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = awww-daemon
exec-once = wl-paste --watch cliphist store
exec-once = QSG_RENDER_LOOP=threaded quickshell

# ── Window rules ──────────────────────────────────────────────────────────────
windowrulev2 = float,  class:^(org\.)?[Qq]uickshell$
windowrulev2 = center, title:^(Settings)$
windowrulev2 = center, title:^(Nebula Setup)$

# ── Keybindings — Quickshell global shortcuts ─────────────────────────────────
# Adjust modifiers to your liking.
bind = SUPER SHIFT, S,       global, quickshell:shutdown
bind = SUPER CTRL, Return,   global, quickshell:appLauncher
bind = SUPER, S,             global, quickshell:toolsWidget
bind = SUPER CTRL, S,        global, quickshell:settingOpen
bind = SUPER, Tab,           global, quickshell:overview
# First-run setup screen (also under Settings → About)
bind = SUPER SHIFT, W,       global, quickshell:welcome
bind = , XF86MonBrightnessUp,   global, quickshell:brightnessIncrease
bind = , XF86MonBrightnessDown, global, quickshell:brightnessDecrease
