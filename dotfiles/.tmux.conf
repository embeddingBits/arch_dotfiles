unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set-option -g status-position top
# set-option -g status-interval 1

set-option -g status-justify "absolute-centre"
set -g status-left-length 85
set -g status-style 'bg=default,fg=#fff4d2'
set-option -g status-left '#[fg=#83a598, bg=default]#[bg=#83a598, fg=#000000]   #[bg=#fabd2f , fg=#000000,bold] #S #[fg=#fabd2f,bg=default]'
set-option -g status-right '#[fg=#fb4934,bg=default]#[bg=#fb4934, fg=#000000]   #[bg=#83a598, fg=#000000, bold] #{s|^/home/[^/]+|~|:session_path} #[fg=#83a598,bg=default]'

set -g window-status-format "#[fg=#303030,bg=default]#[fg=#ebdbb2,bg=#303030,bold]   #I #[fg=#ebdbb2,bg=#404040,bold] #W #[fg=#404040,bg=default]"
set -g window-status-current-format "#[fg=#fb4934,bg=default]#[fg=#000000,bg=#fb4934,bold]   #I #[fg=#000000,bg=#83a598 ,bold] #W #[fg=#83a598,bg=default]"

set -g message-style bg=#fabd2f,fg=#1d1d1d,bold
set -g message-command-style bg=#1d1d1d,fg=#fabd2f,bold

set -g pane-active-border-style fg=#ebdbb2
set -g pane-border-style fg=#555555
